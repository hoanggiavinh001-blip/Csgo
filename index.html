<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS WebGame - Fixed Enemy Visibility</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; border: 2px solid rgba(0, 255, 255, 0.9); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #crosshair::before { content: ''; position: absolute; top: 3px; left: 3px; width: 2px; height: 2px; background: red; border-radius: 50%; }
        #hud { position: absolute; bottom: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; border: 1px solid #444; }
        #minimap { position: absolute; top: 20px; right: 20px; width: 140px; height: 140px; border: 2px solid #00ffff; border-radius: 50%; background: rgba(0,0,0,0.6); z-index: 10; }
        #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; background: rgba(10,10,15,0.9); padding: 40px; border-radius: 12px; border: 1px solid #00ffff; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
        #instructions h2 { margin-top: 0; color: #00ffff; letter-spacing: 2px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">HP: <span id="hp" style="color: #00ff00;">100</span> | Mạng hạ: <span id="kills" style="color: #ffff00;">0</span></div>
    <canvas id="minimap" width="140" height="140"></canvas>
    
    <div id="instructions">
        <h2>NHẤP ĐỂ BẮT ĐẦU CHƠI</h2>
        <p>Di chuyển: <b>WASD</b></p>
        <p>Bắn: <b>Chuột trái</b> | Nhắm xoay: <b>Chuột</b></p>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let enemies = [];
        let playerHP = 100, kills = 0;
        let isLocked = false;

        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e141d);
            scene.fog = new THREE.FogExp2(0x0e141d, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            // 1. Ánh sáng đầy đủ (Đảm bảo Kẻ địch luôn nhìn thấy rõ)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(30, 50, 20);
            scene.add(dirLight);

            // 2. Sàn đấu 3D
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2536, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(300, 60, 0x00ffff, 0x223344);
            grid.position.y = 0.01;
            scene.add(grid);

            // 3. Mô hình tay & súng First-Person
            createWeapon();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            setupControls();

            // Sinh 8 kẻ địch ban đầu
            for(let i = 0; i < 8; i++) {
                spawnEnemy();
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createWeapon() {
            const weaponGroup = new THREE.Group();
            
            // Thân súng
            const gunGeo = new THREE.BoxGeometry(0.12, 0.16, 0.6);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metallic: 0.8, roughness: 0.2 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.22, -0.22, -0.45);
            weaponGroup.add(gun);

            // Nòng súng
            const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.22, -0.18, -0.7);
            weaponGroup.add(barrel);

            camera.add(weaponGroup);
            scene.add(camera);
        }

        function spawnEnemy() {
            const enemyGroup = new THREE.Group();

            // Thân kẻ địch (Màu đỏ rực rỡ + hiệu ứng phát sáng nhẹ để không bao giờ bị biến mất)
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xff0033, 
                emissive: 0x550011, 
                roughness: 0.3 
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            enemyGroup.add(body);

            // Đầu kẻ địch
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.05;
            enemyGroup.add(head);

            // Mắt phát sáng chỉ hướng nhìn của địch
            const eyeGeo = new THREE.BoxGeometry(0.4, 0.1, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(0, 2.1, -0.3);
            enemyGroup.add(eye);

            // Vị trí xuất hiện ngẫu nhiên cách người chơi 25-60 đơn vị
            const radius = 25 + Math.random() * 35;
            const angle = Math.random() * Math.PI * 2;
            enemyGroup.position.set(
                camera.position.x + Math.cos(angle) * radius, 
                0, 
                camera.position.z + Math.sin(angle) * radius
            );

            enemyGroup.userData = { hp: 100, speed: 4 + Math.random() * 2 };
            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        function setupControls() {
            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === document.body;
                instructions.style.display = isLocked ? 'none' : 'block';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                camera.rotation.y -= e.movementX * 0.0022;
                camera.rotation.x -= e.movementY * 0.0022;
                camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
            });

            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (isLocked && e.button === 0) shoot();
            });
        }

        function shoot() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Tạo hiệu ứng tia đạn bắn
            const bulletGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(camera.position);
            scene.add(bullet);

            const intersects = raycaster.intersectObjects(enemies.map(e => e.children).flat());

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                let enemyGroup = hitMesh.parent;
                enemyGroup.userData.hp -= 35;

                // Đổi màu kẻ địch khi bị trúng đạn
                hitMesh.material.color.setHex(0xffffff);
                setTimeout(() => hitMesh.material.color.setHex(0xff0033), 120);

                if (enemyGroup.userData.hp <= 0) {
                    scene.remove(enemyGroup);
                    enemies = enemies.filter(e => e !== enemyGroup);
                    kills++;
                    document.getElementById('kills').innerText = kills;
                    spawnEnemy();
                }
            }

            setTimeout(() => scene.remove(bullet), 120);
        }

        function updateMinimap() {
            minimapCtx.clearRect(0, 0, 140, 140);
            const center = 70;
            const scale = 1.2;

            // Người chơi
            minimapCtx.fillStyle = '#00ffff';
            minimapCtx.beginPath();
            minimapCtx.arc(center, center, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            // Kẻ địch
            minimapCtx.fillStyle = '#ff0033';
            enemies.forEach(e => {
                const dx = (e.position.x - camera.position.x) * scale;
                const dz = (e.position.z - camera.position.z) * scale;
                if (Math.hypot(dx, dz) < 65) {
                    minimapCtx.beginPath();
                    minimapCtx.arc(center + dx, center + dz, 3.5, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 120.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 120.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 1.6; // Khóa độ cao góc nhìn FPS

                // AI kẻ địch đuổi theo người chơi
                enemies.forEach(enemy => {
                    const dir = new THREE.Vector3().subVectors(camera.position, enemy.position);
                    dir.y = 0;
                    dir.normalize();
                    enemy.position.addScaledVector(dir, enemy.userData.speed * delta);
                    enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);

                    // Xử lý mất máu khi kẻ địch chạm vào người
                    if (enemy.position.distanceTo(camera.position) < 1.4) {
                        playerHP = Math.max(0, playerHP - 0.3);
                        document.getElementById('hp').innerText = Math.floor(playerHP);
                    }
                });

                updateMinimap();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
